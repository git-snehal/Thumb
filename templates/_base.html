<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
@font-face { font-family: 'Poppins'; font-weight: 300; src: url('{{ font_host }}fonts/Poppins-Light.ttf'); }
@font-face { font-family: 'Poppins'; font-weight: 400; src: url('{{ font_host }}fonts/Poppins-Regular.ttf'); }
@font-face { font-family: 'Poppins'; font-weight: 500; src: url('{{ font_host }}fonts/Poppins-Medium.ttf'); }
@font-face { font-family: 'Poppins'; font-weight: 700; src: url('{{ font_host }}fonts/Poppins-Bold.ttf'); }

{{ font_css|safe }}

* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --font-head: {{ font.css_family|safe }}, 'Poppins', 'Noto Sans CJK JP', sans-serif;
  --font-body: {{ (font.css_family if font.body_safe else "'Poppins'")|safe }}, 'Poppins', 'Noto Sans CJK JP', sans-serif;
  --track: {{ font.tracking }};
}
:root { --accent: {{ a.accent }}; --accent-fg: {{ a.accent_fg }}; --vivid: {{ a.accent_vivid or a.accent }}; --vivid-fg: {{ a.accent_vivid_fg or a.accent_fg }}; }
html, body { width: 1280px; height: 720px; overflow: hidden; }
body {
  position: relative;
  font-family: var(--font-body);
  font-synthesis: none;
  -webkit-font-smoothing: antialiased;
}
img { display: block; }
.fill-img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.clamp { display: -webkit-box; -webkit-box-orient: vertical; overflow: hidden; }
h1, .hd, .btn, .b, .bd, .go, .w { font-family: var(--font-head); }
body h1 { letter-spacing: var(--track); }
body.nocaps h1, body.nocaps h1 span { text-transform: none !important; }

/* User brand: text and logo are placed independently, each in its own corner. */
.brand-ov { position: absolute; z-index: 50; display: flex; align-items: center; gap: 12px; }
.brand-ov.tl { top: 22px; left: 24px; }
.brand-ov.tr { top: 22px; right: 24px; flex-direction: row-reverse; }
.brand-ov.bl { bottom: 22px; left: 24px; }
.brand-ov.br { bottom: 22px; right: 24px; flex-direction: row-reverse; }
.brand-ov img { display: block; max-height: 54px; max-width: 220px; object-fit: contain; filter: drop-shadow(0 2px 6px rgba(0,0,0,.35)); }
.brand-ov span {
  font-family: var(--font-head); font-weight: 700; font-size: 20px; line-height: 1.3; color: #fff; white-space: nowrap;
  padding: 6px 15px; border-radius: 10px; background: rgba(8,8,14,.58); border: 1px solid rgba(255,255,255,.2);
  backdrop-filter: blur(8px);
}
/* plain style (no chip): used by templates that want a clean text watermark */
.brand-ov.plain.tl { top: 36px; left: 56px; } .brand-ov.plain.tr { top: 36px; right: 56px; }
.brand-ov.plain.bl { bottom: 36px; left: 56px; } .brand-ov.plain.br { bottom: 36px; right: 56px; }
.brand-ov.plain img { max-height: 46px; }
.brand-ov.plain span { background: none; border: 0; backdrop-filter: none; padding: 0; font-size: 19px; letter-spacing: .02em;
  text-transform: uppercase; text-shadow: 0 2px 10px rgba(0,0,0,.6); }
{% block style %}{% endblock %}
</style>
</head>
<body class="{{ variant }}{{ ' nocaps' if not font.caps }}">
{% block body %}{% endblock %}
{% for g in brand_groups %}{% if g.logo or (g.text and not brand_inline) %}
<div class="brand-ov {{ g.pos }}{{ ' plain' if brand_style == 'plain' }}" data-pos="{{ g.pos }}">
  {% if g.logo %}<img src="{{ g.logo }}">{% endif %}
  {% if g.text and not brand_inline %}<span>{{ g.text }}</span>{% endif %}
</div>
{% endif %}{% endfor %}
<script>
/* Measure each brand corner once fonts + logo are ready, and publish how much room it takes:
   --tl-shift / --tr-shift ... = distance from that side edge, --tl-h / --bl-h ... = distance from top/bottom.
   Templates use them to keep their own content clear. Then run the template's own fitting. */
window.__ready = (async () => {
  await document.fonts.ready;
  const root = document.documentElement.style;
  const groups = [...document.querySelectorAll('.brand-ov')];
  await Promise.all(groups.flatMap(g => [...g.querySelectorAll('img')].map(i => i.decode().catch(() => {}))));
  for (const g of groups) {
    const r = g.getBoundingClientRect(), pos = g.dataset.pos;
    root.setProperty('--' + pos + '-shift', ((pos[1] === 'l' ? r.right : 1280 - r.left) + 20) + 'px');
    root.setProperty('--' + pos + '-h', ((pos[0] === 't' ? r.bottom : 720 - r.top) + 14) + 'px');
  }
  if (window.__fit) window.__fit();
})();

/* shrink a title until it fits `maxLines` lines and its container's width */
window.fitTitle = (el, maxLines, start, min = 28) => {
  let fs = start; el.style.fontSize = fs + 'px';
  const cs = getComputedStyle(el), lh = (parseFloat(cs.lineHeight) / parseFloat(cs.fontSize)) || 1.05;
  while (fs > min && (el.scrollWidth > el.clientWidth + 1 || el.getBoundingClientRect().height > fs * lh * maxLines + 2)) {
    fs -= 2; el.style.fontSize = fs + 'px';
  }
  return fs;
};
</script>
</body>
</html>
